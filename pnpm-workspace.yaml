packages: []

# `pnpm exec` and `pnpm run` otherwise run an implicit install first, which is
# unacceptable inside a git hook: committing would run postinstall scripts.
verifyDepsBeforeRun: false

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  "@prisma/engines": true
  prisma: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@rolldown/binding-linux-s390x-gnu@1.2.4'
